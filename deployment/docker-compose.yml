version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: isro_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_TARGET_DB}
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/mongo-init.js:ro
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

  minio:
    image: minio/minio
    container_name: isro_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
  
  minio-init:
    image: minio/mc
    container_name: isro_minio_init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET} 
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set myminio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
          echo '...waiting for minio to start...'
          sleep 1
        done
        mc mb --ignore-existing myminio/$$MINIO_BUCKET
        mc anonymous set download myminio/$$MINIO_BUCKET
        echo 'Bucket created successfully.'
        exit 0

  backend:
    build: ../backend
    container_name: isro_backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_TARGET_DB}?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      MODE: production
      DB_NAME: ${MONGO_TARGET_DB}
      # UPDATED: Using internal service names
      INFERENCE_URL_SAM: "http://inference-sam:8000"
      INFERENCE_URL_QWEN: "http://inference-qwen:3000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_ENDPOINT: ${HOST_IP} # Kept as HOST_IP because the frontend (browser) needs to reach MinIO too
      MINIO_PORT: 9000
      MINIO_BUCKET: ${MINIO_BUCKET}
      FRONTEND_URL: http://${HOST_IP}:5173
    depends_on:
      - mongodb
      - minio
      - inference-qwen
      - inference-sam

  frontend:
    build: ../frontend
    container_name: isro_frontend
    ports:
      - "5173:5173"
    environment:
      HOST: 0.0.0.0
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}

  inference-qwen:
    build: ../inference/qwen
    container_name: isro_inference_qwen
    environment:
      PORT: 3000
    volumes:
      - ../inference/qwen/qwen_lora_model:/app/qwen_lora_model
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "3000:3000"
    restart: always

  inference-sam:
    build: ../inference/sam3
    container_name: isro_inference_sam
    environment:
      PORT: 8000
    volumes:
      - ../inference/sam3/sam_model:/app/sam_model
      - ../inference/sam3/bert_model_subtype:/app/bert_model_subtype
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8000:8000"
    restart: always

volumes:
  mongo_data:
  minio_data:
